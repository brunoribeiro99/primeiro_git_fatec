<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cadastro de Aluno</title>
</head>
<body>
    <div class="container-fluid">
        <div class="container">
<h1 class="text-center mt-3">Cadastro de Aluno</h1>
<div class="row">
    <form action="#" method="POST">
     <div class="row">
        <div class="col-8">
          <input type="text" class="form-control" placeholder="nome completo" aria-label="nome completo">
        </div>
        <div class="col-4">
          <input type="text" class="form-control" placeholder="CEP" aria-label="CEP">

        </div>
       
      
      <div class="row mt-2">
      <div class="col-6">
        
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Digite seu endereço">
      </div>
      <div class="col-2">
            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Digite o número">
        </div>
      <div class="col-4">
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Digite seu bairro">
      </div>
        </div>

        <div class="row mt-2">
      <div class="col-4">
        
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Digite seu telefone">
      </div>
      <div class="col-6">
            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Digite o seu email">
        </div>
      <div class="col-2">
        <input type="date" class="form-control" id="exampleFormControlInput1" placeholder="Digite sua data de nascimento">
      </div>
        </div>
        <div class="row mt-2">
      <div class="col-3">
        <select class="form-select" aria-label="Default">
            <option selected>Selecione seu gênero</option>
            <option value="1">Masculino</option>
            <option value="2">Feminino</option>
            <option value="3">Outro</option>
          </select>
      </div>
      <div class="col-4">
            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Digite o seu CPF">
        </div>
      <div class="col-4">
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Digite seu RG">
      </div>
        </div>
        <div class="row mt-2">
            <div class="col-12">
                <textarea class="form-control" rows="3" placeholder="Digite suas observações"></textarea>
            </div>
        
    </form>
  </div>
</div>

        </div>
  
        </div>
    
</body>
</html>
